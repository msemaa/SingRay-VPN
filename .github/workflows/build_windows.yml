name: Build SingRay for Windows

on:
  push:
    branches: [ main, master, windows-client ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            arch: x64
            singbox: windows-amd64
            xray: windows-64
            wintun: amd64
          - rid: win-x86
            arch: x86
            singbox: windows-386
            xray: windows-32
            wintun: x86
          - rid: win-arm64
            arch: arm64
            singbox: windows-arm64
            xray: windows-arm64-v8a
            wintun: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download sing-box and Xray cores
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $cores = "windows/src/SingRay.Win/cores"
          New-Item -ItemType Directory -Force -Path $cores | Out-Null
          $headers = @{ 'User-Agent' = 'SingRay-CI'; 'Authorization' = "Bearer $env:GH_TOKEN" }

          try {
            $sb = Invoke-RestMethod -Headers $headers https://api.github.com/repos/SagerNet/sing-box/releases/latest
            $sbAsset = $sb.assets | Where-Object { $_.name -like "*${{ matrix.singbox }}.zip" } | Select-Object -First 1
            if ($sbAsset) {
              Invoke-WebRequest -Headers $headers -Uri $sbAsset.browser_download_url -OutFile sb.zip
              Expand-Archive sb.zip -DestinationPath sb -Force
              Get-ChildItem sb -Recurse -Filter sing-box.exe | Select-Object -First 1 | ForEach-Object {
                Copy-Item $_.FullName "$cores/sing-box.exe" -Force
              }
            } else {
              Write-Warning "sing-box asset for ${{ matrix.singbox }} not found"
            }
          } catch { Write-Warning "sing-box download failed: $_" }

          try {
            $xr = Invoke-RestMethod -Headers $headers https://api.github.com/repos/XTLS/Xray-core/releases/latest
            $xrAsset = $xr.assets | Where-Object { $_.name -like "Xray-${{ matrix.xray }}.zip" } | Select-Object -First 1
            if ($xrAsset) {
              Invoke-WebRequest -Headers $headers -Uri $xrAsset.browser_download_url -OutFile xr.zip
              Expand-Archive xr.zip -DestinationPath xr -Force
              Get-ChildItem xr -Recurse -Filter xray.exe | Select-Object -First 1 | ForEach-Object {
                Copy-Item $_.FullName "$cores/xray.exe" -Force
              }
              Get-ChildItem xr -Recurse -Include geoip.dat,geosite.dat | ForEach-Object {
                Copy-Item $_.FullName "$cores/" -Force
              }
            } else {
              Write-Warning "Xray asset for ${{ matrix.xray }} not found"
            }
          } catch { Write-Warning "Xray download failed: $_" }

          try {
            Invoke-WebRequest -Uri https://www.wintun.net/builds/wintun-0.14.1.zip -OutFile wintun.zip
            Expand-Archive wintun.zip -DestinationPath wt -Force
            $want = "${{ matrix.wintun }}"
            $dll = Get-ChildItem wt -Recurse -Filter wintun.dll | Where-Object { $_.FullName -match $want } | Select-Object -First 1
            if ($dll) { Copy-Item $dll.FullName "$cores/wintun.dll" -Force }
          } catch { Write-Warning "Wintun download skipped: $_" }

          Get-ChildItem $cores -ErrorAction SilentlyContinue

      - name: Publish (self-contained, single file, no symbols)
        shell: pwsh
        run: |
          dotnet publish windows/src/SingRay.Win/SingRay.Win.csproj `
            -c Release -r ${{ matrix.rid }} --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none -p:DebugSymbols=false `
            -p:SatelliteResourceLanguages=en `
            -o publish/${{ matrix.arch }}

      - name: Strip any leftover symbol files
        shell: pwsh
        run: |
          Get-ChildItem publish/${{ matrix.arch }} -Recurse -Include *.pdb,*.xml | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Sign binaries (optional)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_BASE64)) {
            Write-Host "No signing certificate configured - skipping."
            exit 0
          }
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:PFX_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if ($signtool) {
            & $signtool.FullName sign /f cert.pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "publish/${{ matrix.arch }}/SingRay.exe"
          } else {
            Write-Warning "signtool.exe not found - skipping signing"
          }
          Remove-Item cert.pfx -Force -ErrorAction SilentlyContinue

      - name: Build installer
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows/dist | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            Write-Warning "Inno Setup unavailable - portable zip only"
            exit 0
          }
          $src = (Resolve-Path "publish/${{ matrix.arch }}").Path
          & $iscc /DMyAppVersion=1.0.0 /DMyArch=${{ matrix.arch }} "/DSourceDir=$src" windows/installer/SingRay.iss

      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows/dist | Out-Null
          Compress-Archive -Path publish/${{ matrix.arch }}/* -DestinationPath windows/dist/SingRay-1.0.0-${{ matrix.arch }}-portable.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SingRay-Windows-${{ matrix.arch }}
          path: windows/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/dist/*

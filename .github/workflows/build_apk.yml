name: Build APK (with native cores)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------------
      # Native cores. The Go cores ship as .aar files and are NOT in git.
      # CI fetches the latest ones here so the APK contains both cores.
      # ------------------------------------------------------------------
      - name: Set up Go (for gomobile builds)
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build libbox.aar (sing-box, latest release)
        run: |
          set -e
          mkdir -p app/libs
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          TAG=$(curl -sS https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r .tag_name)
          echo "sing-box version: $TAG"
          git clone --depth 1 --branch "$TAG" https://github.com/SagerNet/sing-box.git /tmp/sing-box
          cd /tmp/sing-box
          gomobile init
          make lib_android || gomobile bind -v -androidapi 24 -javapkg=io.nekohasekai -libname=box -o libbox.aar -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api" ./experimental/libbox
          cp libbox.aar "$GITHUB_WORKSPACE/app/libs/libbox.aar"
        continue-on-error: true

      - name: Fetch or build libXray.aar (Xray-core)
        run: |
          mkdir -p app/libs
          if [ -f "app/libs/libXray.aar" ]; then
            echo "libXray.aar already present"
          else
            echo "Downloading prebuilt libXray.aar from XTLS/libXray release..."
            curl -sL https://github.com/XTLS/libXray/releases/download/v26.9.9/libxray-android.zip -o /tmp/libxray.zip
            unzip -q -o /tmp/libxray.zip -d /tmp/xray_out/
            find /tmp/xray_out/ -name "libXray.aar" -exec cp {} app/libs/libXray.aar \;
            rm -rf /tmp/libxray.zip /tmp/xray_out
          fi

      - name: Report bundled cores
        run: ls -lh app/libs || echo "no native cores bundled; app falls back to the built-in Kotlin core"

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: singray-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

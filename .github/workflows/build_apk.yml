name: Build APK (with native cores)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------------
      # Native cores are OPTIONAL. A failed download must never fail the
      # build: the app falls back to the built-in Kotlin core.
      # ------------------------------------------------------------------
      - name: Fetch libbox.aar (sing-box core)
        continue-on-error: true
        run: |
          mkdir -p app/libs
          if [ -s app/libs/libbox.aar ]; then
            echo "libbox.aar already present"
            exit 0
          fi
          echo "Downloading prebuilt libbox.aar..."
          curl -fL --retry 5 --retry-delay 5 \
            "https://github.com/Leadaxe/sing-box-lx/releases/download/v1.14.1-lx.8/libbox-1.14.1-lx.8.aar" \
            -o app/libs/libbox.aar || rm -f app/libs/libbox.aar
          if [ -s app/libs/libbox.aar ]; then
            echo "Downloaded libbox.aar ($(stat -c%s app/libs/libbox.aar) bytes)"
          else
            echo "::warning::libbox.aar unavailable - building without the sing-box native core"
          fi

      - name: Fetch libXray.aar (Xray-core)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/libs
          if [ -s app/libs/libXray.aar ]; then
            echo "libXray.aar already present"
            exit 0
          fi
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/XTLS/libXray/releases/latest \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((a['browser_download_url'] for a in d.get('assets',[]) if 'android' in a['name'].lower() and a['name'].endswith('.zip')), ''))")
          if [ -z "$url" ]; then
            echo "::warning::No Android asset in the latest libXray release - skipping Xray core"
            exit 0
          fi
          echo "Downloading $url"
          curl -fL --retry 5 --retry-delay 5 "$url" -o /tmp/libxray.zip || exit 0
          rm -rf /tmp/xray_out
          unzip -q -o /tmp/libxray.zip -d /tmp/xray_out
          found=$(find /tmp/xray_out -name "*.aar" | head -n1)
          if [ -z "$found" ]; then
            echo "::warning::No .aar inside the libXray archive - skipping Xray core"
            exit 0
          fi
          cp "$found" app/libs/libXray.aar
          python3 .ci/strip_go_classes.py app/libs/libXray.aar
          echo "Prepared libXray.aar ($(stat -c%s app/libs/libXray.aar) bytes)"

      - name: Report bundled cores
        run: ls -lh app/libs || echo "no app/libs directory"

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from base64"
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android \
                -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated a fresh debug.keystore"
            fi
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: singray-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

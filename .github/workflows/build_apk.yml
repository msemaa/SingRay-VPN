name: Build APK (with native cores)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # ------------------------------------------------------------------
      # Native cores. The Go cores ship as .aar files (>90MB),
      # so they are downloaded here by CI so the resulting APK bundles both cores.
      # ------------------------------------------------------------------
      - name: Fetch libbox.aar (sing-box core)
        run: |
          mkdir -p app/libs
          if [ -f "app/libs/libbox.aar" ] && [ $(wc -c < "app/libs/libbox.aar") -gt 10000000 ]; then
            echo "libbox.aar already present"
          else
            echo "Downloading prebuilt libbox.aar (sing-box 1.14.x)..."
            curl -fL --retry 5 --retry-delay 5 \
              "https://github.com/Leadaxe/sing-box-lx/releases/download/v1.14.1-lx.8/libbox-1.14.1-lx.8.aar" \
              -o app/libs/libbox.aar
          fi
          test -s app/libs/libbox.aar
          echo "Verified libbox.aar size: $(ls -lh app/libs/libbox.aar | awk '{print $5}')"

      - name: Fetch libXray.aar (Xray-core)
        run: |
          mkdir -p app/libs
          if [ -f "app/libs/libXray.aar" ] && [ $(wc -c < "app/libs/libXray.aar") -gt 10000000 ]; then
            echo "libXray.aar already present"
          else
            echo "Downloading prebuilt libXray.aar (Xray v26.x)..."
            curl -fL --retry 5 --retry-delay 5 \
              "https://github.com/XTLS/libXray/releases/download/v26.9.9/libxray-android.zip" \
              -o /tmp/libxray.zip
            unzip -q -o /tmp/libxray.zip -d /tmp/xray_out/
            find /tmp/xray_out/ -name "libXray.aar" -exec cp {} app/libs/libXray.aar \;
            rm -rf /tmp/libxray.zip /tmp/xray_out

            echo "Deduplicating gomobile runtime classes from libXray.aar..."
            python3 -c "
            import zipfile, io, os
            aar = 'app/libs/libXray.aar'
            tmp = 'app/libs/libXray_clean.aar'
            with zipfile.ZipFile(aar, 'r') as zin, zipfile.ZipFile(tmp, 'w', compression=zipfile.ZIP_DEFLATED) as zout:
                for item in zin.infolist():
                    data = zin.read(item.filename)
                    if item.filename == 'classes.jar':
                        jin = zipfile.ZipFile(io.BytesIO(data), 'r')
                        jout_buf = io.BytesIO()
                        jout = zipfile.ZipFile(jout_buf, 'w', compression=zipfile.ZIP_DEFLATED)
                        for jitem in jin.infolist():
                            if not jitem.filename.startswith('go/'):
                                jout.writestr(jitem, jin.read(jitem.filename))
                        jout.close()
                        data = jout_buf.getvalue()
                    zout.writestr(item, data)
            os.replace(tmp, aar)
            print('Successfully deduplicated gomobile classes.')
            "
          fi
          test -s app/libs/libXray.aar
          echo "Verified libXray.aar size: $(ls -lh app/libs/libXray.aar | awk '{print $5}')"

      - name: Report bundled cores
        run: ls -lh app/libs

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from base64"
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated new debug.keystore"
            fi
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: singray-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

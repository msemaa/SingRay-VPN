name: Build APK (with native cores)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:
    inputs:
      build_sing_box_from_source:
        description: "Build libbox.aar from sing-box sources (slow, ~15 min) instead of the prebuilt AAR"
        type: boolean
        default: false
      include_xray:
        description: "Also bundle libXray.aar (optional - sing-box already covers every protocol)"
        type: boolean
        default: false

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prebuilt libbox.aar. This is the exact artifact the app was verified
  # against; Libbox.version() reports 1.14.1-lx.8.
  LIBBOX_AAR_URL: https://github.com/Leadaxe/sing-box-lx/releases/download/v1.14.1-lx.8/libbox-1.14.1-lx.8.aar
  LIBBOX_AAR_SHA256: beab998c9d0a46826db0d654b5315fa6a25d9e1cbf8cb10c547e757444c26d80
  LIBBOX_VERSION: 1.14.1-lx.8
  SING_BOX_REF: v1.14.1
  NDK_VERSION: r28

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # sing-box: prebuilt by default. Compiling it with gomobile takes
      # 10-15 minutes and breaks on every toolchain hiccup, so it is now
      # opt-in via workflow_dispatch.
      # ---------------------------------------------------------------
      - name: Download prebuilt libbox.aar (sing-box)
        if: ${{ github.event.inputs.build_sing_box_from_source != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors \
            -o app/libs/libbox.aar "$LIBBOX_AAR_URL"
          echo "$LIBBOX_AAR_SHA256  app/libs/libbox.aar" | sha256sum -c -
          echo "sing-box core: $(stat -c%s app/libs/libbox.aar) bytes"

      - name: Checkout sing-box ${{ env.SING_BOX_REF }}
        if: ${{ github.event.inputs.build_sing_box_from_source == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: .cores/sing-box

      - name: Set up Go
        if: ${{ github.event.inputs.build_sing_box_from_source == 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # sing-box's own build script refuses to run on anything but JDK 17
      # (cmd/internal/build_libbox: checkJavaVersion wants "openjdk 17").
      - name: Set up JDK 17 (core build)
        if: ${{ github.event.inputs.build_sing_box_from_source == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android NDK
        id: ndk
        if: ${{ github.event.inputs.build_sing_box_from_source == 'true' }}
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false

      - name: Build libbox.aar from source
        if: ${{ github.event.inputs.build_sing_box_from_source == 'true' }}
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          mkdir -p app/libs
          cd .cores/sing-box
          java --version
          make lib_install
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android
          cd -
          cp .cores/sing-box/libbox.aar app/libs/libbox.aar
          echo "LIBBOX_VERSION=${SING_BOX_REF} (from source)" >> "$GITHUB_ENV"
          echo "sing-box core: $(stat -c%s app/libs/libbox.aar) bytes"

      # ---------------------------------------------------------------
      # Xray is optional. XrayEngine binds to it through reflection, so a
      # build without libXray.aar compiles fine and simply reports Xray as
      # unavailable while sing-box handles every protocol.
      # ---------------------------------------------------------------
      - name: Download libXray.aar (optional)
        id: libxray
        if: ${{ github.event.inputs.include_xray == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p app/libs
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/XTLS/libXray/releases/latest \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((a['browser_download_url'] for a in d.get('assets',[]) if 'android' in a['name'].lower()), ''))")
          test -n "$url"
          curl -fL --retry 5 --retry-delay 5 --retry-all-errors "$url" -o /tmp/libxray.zip
          rm -rf /tmp/xray_out && unzip -q -o /tmp/libxray.zip -d /tmp/xray_out
          aar=$(find /tmp/xray_out -name '*.aar' ! -name '*sources*' | head -n1)
          test -n "$aar"
          cp "$aar" app/libs/libXray.aar
          # gomobile ships the same go/* helper classes in every AAR; keeping
          # both breaks dexing with "Type go.Seq is defined multiple times".
          python3 .ci/strip_go_classes.py app/libs/libXray.aar
          echo "Xray core: $(stat -c%s app/libs/libXray.aar) bytes"

      - name: Reject cores that would overwrite each other
        if: ${{ github.event.inputs.include_xray == 'true' }}
        run: |
          set -e
          list_so() { unzip -l "$1" 2>/dev/null | awk '{print $4}' | grep '\.so$' | xargs -n1 basename 2>/dev/null | sort -u; }
          a=$(list_so app/libs/libbox.aar || true)
          b=$(list_so app/libs/libXray.aar || true)
          echo "libbox:  $(echo $a | tr '\n' ' ')"
          echo "libXray: $(echo $b | tr '\n' ' ')"
          dup=$(comm -12 <(echo "$a") <(echo "$b") || true)
          if [ -n "$dup" ]; then
            echo "::error::Both cores ship $dup - one would silently overwrite the other at packaging time. Re-run with build_sing_box_from_source=true (that build names its library libgobox.so) or leave include_xray off."
            exit 1
          fi

      # A green build that silently ships no native core is worse than a red
      # one: the app can then only use the limited built-in Kotlin core.
      - name: Verify bundled cores
        run: |
          ls -lh app/libs || true
          if [ ! -s app/libs/libbox.aar ]; then
            echo "::error::libbox.aar (sing-box) is missing - refusing to publish an APK that can only use the built-in core"
            exit 1
          fi
          {
            echo "### Bundled native cores"
            echo "- sing-box ${LIBBOX_VERSION} ($(stat -c%s app/libs/libbox.aar) bytes)"
            if [ -s app/libs/libXray.aar ]; then
              echo "- Xray / libXray ($(stat -c%s app/libs/libXray.aar) bytes)"
            else
              echo "- Xray / libXray: not bundled (optional; sing-box handles every protocol)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21 (Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from base64"
            else
              keytool -genkeypair -v -keystore debug.keystore -storepass android \
                -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
                -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated a fresh debug.keystore"
            fi
          fi

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: singray-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload native cores
        uses: actions/upload-artifact@v4
        with:
          name: singray-native-cores
          path: app/libs/*.aar
          if-no-files-found: warn
